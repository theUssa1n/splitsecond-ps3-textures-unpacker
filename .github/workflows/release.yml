name: Release

# Builds the CLI for Windows and Linux and attaches the binaries to a GitHub
# Release. Triggered manually, or automatically when a tag like `v0.1.0`
# is pushed. The archive name uses the tag (e.g. v0.1.0); when run manually
# without a tag it falls back to `ci`.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe_ext: .exe
            archive_ext: .zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe_ext: ''
            archive_ext: .tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Some rfd backends on Linux need GTK3 headers to build. The install is
      # harmless when the default (xdg-portal, pure Rust) backend is used.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Build (release)
        run: cargo build --release --locked

      - name: Stage binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging release
          cp target/release/untexs${{ matrix.exe_ext }} staging/
          cp target/release/unpack-textures-and-streamtex${{ matrix.exe_ext }} staging/
          cp README.md Structural_Comparison.txt textures_ps3.hexpat staging/ || true

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path staging/* -DestinationPath release/unpack-texs-${{ github.ref_name }}-windows-x86_64.zip

      - name: Package (Linux tar.gz)
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf release/unpack-texs-${{ github.ref_name }}-linux-x86_64.tar.gz -C staging .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unpack-texs-${{ github.ref_name }}-${{ matrix.os }}
          path: release/
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
